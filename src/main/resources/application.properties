spring.application.name=vidu1-login-spring-security
server.port=8081

# Database - SQL Server (Windows Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=vidu1_login;integratedSecurity=true;encrypt=false;trustServerCertificate=true;characterEncoding=UTF-8
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Encoding
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
